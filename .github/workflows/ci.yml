name: ZCrypt Multi-Arch Build & Crypto Verification CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Format and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: all files formatted"

      - name: Verify Go dependencies are tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result."
            git diff -- go.mod go.sum
            exit 1
          fi
          echo "go.mod: tidy"

      - name: go vet
        run: go vet ./...

  test:
    name: Unit Tests (native amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # GitHub-hosted runners have no s390x hardware, so the CPACF paths take
      # their !s390x stubs here. The s390x correctness evidence is the NIST
      # known-answer verification run on real hardware and committed under
      # docs/benchmarks/.
      - name: go test
        run: go test ./... -v

  build:
    name: Verify Multi-Arch Crypto Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile ZCrypt for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -v -ldflags "-s -w" -o bin/zcrypt-${{ matrix.goos }}-${{ matrix.goarch }} ./main.go
          ls -lh bin/

  perf-regression:
    name: Performance Regression (advisory)
    runs-on: ubuntu-latest
    # Advisory, not a gate. GitHub-hosted runners are shared VMs whose
    # throughput varies by a factor of two between runs, and none of them are
    # s390x. A hard failure here would fire on noise and on the architecture
    # mismatch rather than on a real regression, which is worse than no check at
    # all: it trains people to ignore the job.
    #
    # What this job does check is that the whole regression machinery still
    # works end to end -- that the baseline parses, the comparison runs, and the
    # exit codes mean what the shell script expects. The actual numeric
    # comparison is meaningful only on the reference machine, where
    # scripts/check-regression.sh --strict is run deliberately.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build zcrypt
        run: go build -o zcrypt .

      - name: Validate the committed baseline
        run: python3 scripts/validate-baseline.py docs/benchmarks/baseline.json

      - name: Run the regression comparison (advisory)
        run: |
          set +e
          ./scripts/check-regression.sh --tolerance 20
          STATUS=$?
          set -e
          case "$STATUS" in
            0) echo "::notice::no regressions reported" ;;
            1) echo "::warning::performance regressed beyond 20% (advisory; runner is not the reference machine)" ;;
            2) echo "::warning::comparison could not be performed (expected: runner is amd64, baseline is s390x)" ;;
            *) echo "::warning::unexpected exit status $STATUS" ;;
          esac
          # Deliberately exit 0: see the job comment.
          exit 0

      - name: Verify the sweep still runs
        run: |
          # The sweep is the most complex measurement path in the project, so it
          # gets a smoke run in CI even though the numbers are meaningless here.
          # A crash or a validation failure would be a real defect.
          ./zcrypt --sweep --sweep-scale 1 | head -40

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression-report
          path: |
            /tmp/zcrypt-regression.json
            /tmp/zcrypt-regression.log
          if-no-files-found: warn
          retention-days: 7
